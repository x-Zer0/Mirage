[package]
name = "mirage-ipc"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Mirage app <-> MirageService protocol and the shared config policy"
publish = false

[dependencies]
tracing = "=0.1.44"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.1"
hex = "=0.4.3"
tokio = { version = "=1.53.3", features = ["io-util"] }

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"]


