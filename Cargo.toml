[package]
name = "mirage"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Windows proxy client for the official Mihomo core"
publish = false
build = "build.rs"

[[bin]]
name = "Mirage"
path = "src/main.rs"

[dependencies]
slint = "=1.18.1"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "sync", "macros", "time", "process", "io-util", "net", "fs"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "registry", "env-filter"] }
tracing-appender = "=0.2.5"
regex = "=1.13.1"
sha2 = "=0.11.1"
hex = "=0.4.3"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
# rustls + rustls-platform-verifier (system store); the ring provider is installed in main.
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
uuid = { version = "=1.28.0", features = ["v4"] }
getrandom = "=0.4.3"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
rfd = "=0.17.2"
zeroize = "=1.9.1"
bytes = "=1.12.1"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "=1.18.1"
embed-manifest = "=1.5.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
