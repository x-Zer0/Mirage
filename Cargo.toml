[package]
name = "mirage"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Windows proxy client for the official Mihomo core"
publish = false
build = "build.rs"

[[bin]]
name = "Mirage"
path = "src/main.rs"

[dependencies]
slint = "=1.18.1"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "registry", "env-filter"] }
tracing-appender = "=0.2.5"
regex = "=1.13.1"
sha2 = "=0.11.1"
hex = "=0.4.3"
thiserror = "=2.0.21"
anyhow = "=1.0.104"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "=1.18.1"
embed-manifest = "=1.5.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
