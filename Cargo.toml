[workspace]
resolver = "3"
members = ["crates/mirage-app", "crates/mirage-ipc", "crates/mirage-svc"]
default-members = ["crates/mirage-app", "crates/mirage-ipc", "crates/mirage-svc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
mirage-ipc = { path = "crates/mirage-ipc" }
slint = { version = "=1.18.1", default-features = false }
tokio = "=1.53.3"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
tracing-appender = "=0.2.5"
regex = "=1.13.1"
sha2 = "=0.11.1"
hex = "=0.4.3"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
reqwest = { version = "=0.13.5", default-features = false }
rustls = { version = "=0.23.45", default-features = false }
percent-encoding = "=2.3.2"
serde = "=1.0.229"
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
uuid = "=1.28.0"
getrandom = "=0.4.3"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false }
rfd = "=0.17.2"
zeroize = "=1.9.1"
bytes = "=1.12.1"
slint-build = "=1.18.1"
embed-manifest = "=1.5.1"
embed-resource = "=3.0.12"
resvg = { version = "=0.48.1", default-features = false }
image = { version = "=0.25.10", default-features = false }
windows = "=0.62.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
