[package]
name = "mirage-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Mirage TUN helper service (DESIGN.md §11.7)"
publish = false

[[bin]]
name = "mirage-service"
path = "src/main.rs"

[dependencies]
mirage-ipc = { path = "../ipc" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.1"
hex = "=0.4.3"
tracing = "=0.1.44"
anyhow = "=1.0.104"

tokio = { version = "=1.53.3", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
]

